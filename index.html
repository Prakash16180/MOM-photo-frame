<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Miracle of Mind – Photo Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Trirong:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --red:#EC1C2D; --red-press:#C8101E; --bg:#000; --fg:#fff; --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.42); --surface:rgba(255,255,255,.08); --line:rgba(255,255,255,.14); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:Geist, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  html[lang="kn"] body, html[lang="kn"] button, html[lang="kn"] .btn { font-family:'Anek Kannada', Geist, system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:12px 16px 32px; display:flex; flex-direction:column; }

  /* Top bar: brand + language */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand img { width:32px; height:32px; border-radius:8px; flex:0 0 auto; }
  .brand span { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lang { display:flex; background:var(--surface); border-radius:999px; padding:3px; flex:0 0 auto; }
  .lang button { appearance:none; border:0; background:transparent; color:var(--muted); font:600 13px Geist, 'Anek Kannada', system-ui, sans-serif; min-height:34px; padding:0 12px; border-radius:999px; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:#fff; color:#000; }

  /* Title block */
  .intro { margin:18px 0 14px; }
  .intro h1 { margin:0; font-size:26px; line-height:1.15; font-weight:700; letter-spacing:-.01em; }
  .intro p { margin:6px 0 0; font-size:15px; color:var(--muted); }

  /* Stage */
  .stage { position:relative; width:100%; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#141414; touch-action:none; box-shadow:0 0 0 1px var(--line); }
  .stage.has-photo { cursor:grab; }
  .stage.dragging { cursor:grabbing; }
  canvas { width:100%; height:100%; display:block; }
  .drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .drop .pill { display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 26px; border-radius:18px; background:rgba(0,0,0,.55); border:1.5px dashed rgba(255,255,255,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); text-align:center; }
  .drop svg { width:34px; height:34px; }
  .drop b { font-size:16px; font-weight:600; }
  .stage.has-photo .drop { display:none; }
  .stage.dragover .drop .pill { border-color:var(--red); background:rgba(236,28,45,.25); }

  /* Adjust */
  .adjust { display:none; margin-top:12px; gap:8px; flex-direction:column; }
  .stage.has-photo ~ .adjust { display:flex; }
  .hint { margin:0; font-size:13px; color:var(--faint); text-align:center; }
  .zoom { display:flex; align-items:center; gap:10px; }
  .zoom svg { width:18px; height:18px; color:var(--muted); flex:0 0 auto; }
  .zoom input { flex:1; accent-color:var(--red); height:28px; }
  .link-btn { appearance:none; border:0; background:none; color:var(--muted); font:500 14px inherit; font-family:inherit; padding:8px 4px; min-height:40px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* Actions */
  .actions { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .row { display:flex; gap:10px; }
  .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; appearance:none; border:0; border-radius:999px; min-height:52px; padding:0 20px; font:600 16px Geist, system-ui, sans-serif; cursor:pointer; text-align:center; color:#fff; user-select:none; }
  .btn svg { width:20px; height:20px; flex:0 0 auto; }
  .btn.primary { background:var(--red); }
  .btn.primary:active { background:var(--red-press); }
  .btn.secondary { background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); }
  .btn.secondary:active { background:rgba(255,255,255,.14); }
  .btn[hidden], .row[hidden], .link-btn[hidden] { display:none; }
  :focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .msg { margin:10px 0 0; min-height:1.2em; font-size:14px; color:var(--muted); text-align:center; }

  /* Privacy + footer */
  .privacy { display:flex; gap:8px; align-items:flex-start; justify-content:center; margin:14px 0 0; font-size:13px; line-height:1.45; color:var(--muted); text-align:left; }
  .privacy svg { width:16px; height:16px; flex:0 0 auto; margin-top:1px; }
  footer { margin-top:28px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--faint); text-align:center; line-height:1.6; }
  footer a { color:var(--muted); }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>

  <div class="intro">
    <h1 data-i18n="title">Make your photo frame</h1>
    <p data-i18n="sub">Add a photo, adjust it, then share.</p>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="1080" height="1080" role="img" aria-label="Framed photo preview"></canvas>
    <label class="drop" for="file">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <b data-i18n="tapAdd">Tap to add your photo</b>
      </span>
    </label>
  </div>

  <div class="adjust">
    <p class="hint" data-i18n="hint">Drag to move · pinch to zoom</p>
    <div class="zoom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5"/></svg>
      <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 11h5M11 8.5v5"/></svg>
      <button type="button" class="link-btn" id="reset" data-i18n="reset">Reset</button>
    </div>
  </div>

  <input id="file" type="file" accept="image/*">

  <div class="actions">
    <!-- Before a photo is added -->
    <label class="btn primary" for="file" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="add">Add photo</span>
    </label>
    <!-- After a photo is added -->
    <div class="row" id="doneRow" hidden>
      <button type="button" class="btn primary" id="shareBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
        <span data-i18n="share">Share</span>
      </button>
      <button type="button" class="btn primary" id="dlBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span data-i18n="download">Download</span>
      </button>
    </div>
    <label class="link-btn" for="file" id="changeBtn" hidden style="align-self:center" data-i18n="change">Change photo</label>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <p class="privacy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span data-i18n="privacy">Your photo is never uploaded or saved. It stays on your device.</span>
  </p>

  <footer><span data-i18n="note">Personal, fan-made frame. Not an official Isha Foundation page.</span><br>
  <span data-i18n="getapp">Get the app:</span> <a id="appLink" href="https://isha.sadhguru.org/in/en/miracle-of-mind">isha.sadhguru.org/miracle-of-mind</a></footer>
</main>

    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 16;
    if (lang === 'kn') {
      // Official Kannada site line: "ದಿನಕ್ಕೆ 7 ನಿಮಿಷ ಧ್ಯಾನ ಮಾಡಿ"
      ctx.fillStyle = '#fff'; ctx.font = '500 58px ' + KN;
      ctx.fillText('ದಿನಕ್ಕೆ', 56, S - 236);
      ctx.fillStyle = RED; ctx.font = '600 120px ' + KN;
      ctx.fillText('7 ನಿಮಿಷ', 52, S - 118);
      const w7 = ctx.measureText('7 ನಿಮಿಷ').width;
      ctx.fillStyle = '#fff'; ctx.font = '500 58px ' + KN;
      ctx.fillText('ಧ್ಯಾನ ಮಾಡಿ', 52 + w7 + 22, S - 118);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '400 32px ' + KN;
      ctx.fillText('ಸದ್ಗುರುಗಳ ಉಚಿತ ಧ್ಯಾನದ ಆ್ಯಪ್', 58, S - 50);
    } else {
      ctx.fillStyle = '#fff'; ctx.font = '500 56px Geist, system-ui, sans-serif';
      ctx.fillText('Own your day in just', 56, S - 228);
      ctx.fillStyle = RED; ctx.font = '500 128px Trirong, Georgia, serif';
      ctx.fillText('7 minutes', 50, S - 104);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '400 30px Geist, system-ui, sans-serif';
      ctx.fillText('Free Meditation App by Sadhguru', 58, S - 50);
    }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

    // App icon (bottom-right)
    if (icon.complete && icon.naturalWidth) {
      const is = 168, ix = S - 56 - is, iy = S - 56 - is - 4;
      ctx.save(); rr(ix, iy, is, is, 38); ctx.clip(); ctx.drawImage(icon, ix, iy, is, is); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; rr(ix, iy, is, is, 38); ctx.stroke();
    }
  }

  // ---------- UI state ----------
  let canShareFiles = false;
  try { canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'])], 'x.png', { type: 'image/png' })] })); } catch (e) {}

  function renderState() {
    const has = !!photo;
    stage.classList.toggle('has-photo', has);
    addBtn.hidden = has;
    doneRow.hidden = !has;
    changeBtn.hidden = !has;
    shareBtn.hidden = !canShareFiles;
    // When Share is available it is the main action; Download becomes secondary.
    dlBtn.classList.toggle('primary', !canShareFiles);
    dlBtn.classList.toggle('secondary', canShareFiles);
  }

  async function loadFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) { msg.textContent = T[lang].badImg; return; }
    msg.textContent = T[lang].loading;
    try {
      photo = ('createImageBitmap' in window) ? await createImageBitmap(file, { imageOrientation: 'from-image' }) : await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    } catch (e) { msg.textContent = T[lang].readErr; return; }
    msg.textContent = '';
    base = Math.max(S / photo.width, S / photo.height); zoom = 1; ox = oy = 0; zoomEl.value = 1;
    renderState(); draw();
  }
  $('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('dragover'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('dragover'));
  stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });

  // Drag + pinch
  const pts = new Map(); let pinch0 = null;
  const scale = () => S / stage.getBoundingClientRect().width;
  stage.addEventListener('pointerdown', e => { if (!photo) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.classList.add('dragging');
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom }; } });
  stage.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; const p = pts.get(e.pointerId), k = scale();
    if (pts.size === 1) { ox += (e.clientX - p.x) * k; oy += (e.clientY - p.y) * k; }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; setZoom(pinch0.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d); }
    clampOffset(); draw(); });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; if (!pts.size) stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { if (!photo) return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.06 : 1/1.06)); clampOffset(); draw(); }, { passive: false });
  stage.addEventListener('dblclick', () => { if (!photo) return; zoom = 1; ox = oy = 0; zoomEl.value = 1; draw(); });
  function setZoom(z) { zoom = Math.min(4, Math.max(1, z)); zoomEl.value = zoom; }
  zoomEl.addEventListener('input', () => { zoom = +zoomEl.value; clampOffset(); draw(); });
  $('reset').addEventListener('click', () => { zoom = 1; ox = oy = 0; zoomEl.value = 1; draw(); });

  // ---------- Output ----------
  const FILENAME = 'miracle-of-mind-frame.png';
  const makeBlob = () => { draw(); return new Promise(r => cv.toBlob(r, 'image/png')); };

  let downloads = null;
  if (window.claude && typeof window.claude.use === 'function') { window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {}); }

  async function download() {
    const blob = await makeBlob();
    if (downloads) {
      try { await downloads.save({ filename: FILENAME, data: blob }); msg.textContent = T[lang].saved; }
      catch (e) { msg.textContent = T[lang].cancelled; }
      return;
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = FILENAME; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    msg.textContent = T[lang].done;
  }
  dlBtn.addEventListener('click', download);

  shareBtn.addEventListener('click', async () => {
    const blob = await makeBlob();
    const file = new File([blob], FILENAME, { type: 'image/png' });
    try { await navigator.share({ files: [file] }); msg.textContent = T[lang].shared; }
    catch (e) {
      if (e && e.name === 'AbortError') return;          // user closed the share sheet
      canShareFiles = false; renderState(); download();  // sharing not allowed here: fall back
    }
  });

  // ---------- Language ----------
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[l][el.dataset.i18n]; });
    $('appLink').href = T[l].link;
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    msg.textContent = '';
    try { localStorage.setItem('mom-lang', l); } catch (e) {}
    draw();
    if (document.fonts && l === 'kn') Promise.all([document.fonts.load("500 58px 'Anek Kannada'"), document.fonts.load("600 120px 'Anek Kannada'"), document.fonts.load("700 64px 'Anek Kannada'")]).then(draw).catch(() => {});
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  icon.onload = draw;
  renderState();
  setLang(lang);
  if (document.fonts) Promise.all([document.fonts.load('500 56px Geist'), document.fonts.load('700 66px Geist'), document.fonts.load('500 128px Trirong')]).then(draw).catch(() => {});
})();
</script>
</body>
</html>
